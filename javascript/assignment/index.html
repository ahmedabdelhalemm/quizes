<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Products</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CRUD Products</h1>
  <div class="form-container">
    <label>Product Name *</label>
    <input type="text" id="pname" placeholder="Enter product name">

    <label>Product Price *</label>
    <input type="number" id="pprice" placeholder="Enter product price">

    <label>Product Category *</label>
    <input type="text" id="pcategory" placeholder="Enter product category">

    <label>Product Description</label>
    <textarea id="pdesc" placeholder="Enter description"></textarea>

    <button onclick="addProduct()">Add Product</button>
  </div>

  <div class="search-box">
    <input type="text" id="search" placeholder="Search For Products..." onkeyup="searchProduct()">
  </div>

  <table id="ptable">
    <thead>
      <tr>
        <th>Index</th>
        <th>Name</th>
        <th>Price</th>
        <th>Category</th>
        <th>Description</th>
        <th>Delete</th>
        <th>Update</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
